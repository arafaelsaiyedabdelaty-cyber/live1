      <p className="mu">كلمة المرور نفسها المستخدمة في نظام الحضور.</p>
      <input type="password" placeholder="كلمة المرور" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==='Enter'&&login()}/>
      {bad&&<p style={{color:'var(--r)'}}>كلمة المرور غير صحيحة</p>}<button onClick={login}>دخول</button></div></main>);

  const sc=k=>'scr'+(scr===k?' on':''),L=arr(lecs).sort((a,b)=>b.t-a.t),hk=Object.keys(hands);
  return(
    <main>
      <header className="top"><div className="lg">🎙</div><div className="tt"><b>الشاعر لايف</b><small>لوحة المدرس</small></div><span className="chip">مباشر</span>
        <select value={cid} disabled={live||ending} onChange={e=>setCid(e.target.value)}><option value="">اختر الصف</option>{core.classes.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></header>

      <section className={sc('live')}><div className="lg2">
        <div><div className="c"><h1>البث المباشر</h1>
          <div className="row"><input placeholder="عنوان المحاضرة" value={ttl} onChange={e=>setTtl(e.target.value)}/>
            {!live&&!ending&&<button className="g" onClick={start}>ابدأ المحاضرة</button>}
            {live&&!ending&&<><button className="x" onClick={share}>{sharing?'إيقاف مشاركة الشاشة':'مشاركة الشاشة'}</button><button className="x" onClick={stop}>إنهاء وحفظ</button></>}</div>
          <video ref={mev} className={live?'':'hide'} muted autoPlay playsInline/>
          {st&&<p id="st" className="mu" style={{marginTop:10}}>{st}</p>}
          {badLinks.map(b=><div key={b.i}><a href={b.href} download={b.name}>نزّل الجزء {b.i+1}</a></div>)}</div></div>
        <div><div className="c"><h1>رفع اليد</h1><div id="hd">{hk.map(k=><div className="i" key={k}><span>✋ {hands[k].n}{talk[k]&&<b style={{color:'var(--g)'}}> (يتحدث)</b>}</span>
          {talk[k]?<button className="x" onClick={()=>mic(k,0)}>إيقاف</button>:<button className="g" onClick={()=>mic(k,1)}>اسمح بالتحدث</button>}</div>)}</div></div>
        {live&&<div className="c"><h1>دردشة هذه المحاضرة</h1>
          <div id="ch" ref={chRef}>{chat?Object.values(chat).map((x,i)=><div key={i} className={'m '+(x.id==='T'?'t me':'')}><b>{x.n}</b><span>{x.m}</span><small>{tm(x.t)}</small></div>)
            :<p className="mu">بداية محاضرة جديدة — لا رسائل بعد.</p>}</div>
          <div className="row"><input placeholder="اكتب رسالة للطلاب" value={cm} onChange={e=>setCm(e.target.value)} onKeyDown={e=>e.key==='Enter'&&say()}/><button className="x" onClick={say}>إرسال</button></div></div>}</div>
      </div></section>

      <section className={sc('files')}><div className="c"><h1>رفع ملف للصف</h1><p className="mu">PDF أو صور أو فيديو، حتى 200 ميجابايت.</p>
        <input type="file" ref={fl} accept=".pdf,image/*,video/*"/><div className="row"><button onClick={upl}>رفع للصف</button><span className="mu">{up}</span></div></div>
        <div className="c"><h1>ملفات الصف</h1>{Object.keys(files||{}).map(k=>{const x=files[k];return <div className="i" key={k}><a href={x.url} target="_blank" rel="noopener">{x.type.startsWith('image')?'🖼':x.type.startsWith('video')?'🎞':'📄'} {x.name}</a><button className="x" onClick={()=>delF(k,x.p)}>حذف</button></div>})}
          {!files&&<p className="mu">لا توجد ملفات.</p>}</div></section>

      <section className={sc('rec')}><div className="c"><h1>المحاضرات المسجلة</h1>
        {L.map((x,i)=><div className="i" key={i}><span>{x.title}<br/><small className="mu">{new Date(x.t).toLocaleString('ar-EG')}</small></span><a href={x.url} target="_blank" rel="noopener">مشاهدة</a></div>)}
        {!L.length&&<p className="mu">{cid?'لا توجد محاضرات محفوظة لهذا الصف بعد.':'اختر الصف أولاً.'}</p>}</div></section>

      <section className={sc('quiz')}><div className="c"><h1>اختبار جديد</h1><input placeholder="عنوان الاختبار" value={qt} onChange={e=>setQt(e.target.value)}/>
        <textarea rows="8" value={qb} onChange={e=>setQb(e.target.value)} placeholder={'اكتب كل سؤال في سطر، ثم خياراته في الأسطر التالية، وضع * قبل الإجابة الصحيحة. افصل بين الأسئلة بسطر فارغ.\n\nما عاصمة مصر؟\n*القاهرة\nالإسكندرية\nأسوان'}/>
        <button onClick={addQ}>حفظ الاختبار للصف</button></div>
        <div className="c"><h1>اختبارات الصف ونتائجها</h1>{Object.keys(quizzes).map(k=><div key={k}><div className="i"><span>{quizzes[k].title} <small className="mu">({quizzes[k].qs.length} أسئلة)</small></span>
          <span><button className="x" onClick={()=>res(k)}>النتائج</button> <button className="x" onClick={()=>delQ(k)}>حذف</button></span></div>
          {qres[k]&&(qres[k].length?qres[k].map((r,i)=><div className="i" key={i}><span>{r.name}</span><b>{r.s} / {r.n}</b></div>):<p className="mu">لم يجب أحد بعد.</p>)}</div>)}</div></section>

      <section className={sc('stu')}><div className="c"><h1>أجهزة الطلاب</h1><p className="mu">كل باركود يرتبط بأول جهاز يدخل به. إذا غيّر الطالب جهازه، فُك الربط من هنا.</p>
        {core.students.filter(x=>x.classId===cid).map(x=><div className="i" key={x.id}><span>{x.name}</span>
          {bind[x.id]?<button className="x" onClick={()=>D.ref('live/bind/'+x.id).remove()}>فك ربط الجهاز</button>:<small className="mu">لم يدخل بعد</small>}</div>)}
        {!cid&&<p className="mu">اختر الصف أولاً.</p>}</div></section>

      <nav className="nav">{TABS.map(([k,ic,t])=><button key={k} className={scr===k?'on':''} onClick={()=>{setScr(k);scrollTo(0,0)}}><span className="ic">{ic}</span>{t}{k==='live'&&<i className="dot"/>}</button>)}</nav>
    </main>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
