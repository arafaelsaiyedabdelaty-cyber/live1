  if(!me)return(
    <main><div className="c login"><div className="lg">🎓</div><h1 style={{justifyContent:'center'}}>الشاعر لايف</h1>

            {Q.qs.map((x,i)=><div className="q" key={i}><b>{i+1}. {x.q}</b>
              {x.o.map((o,j)=><label key={j}><input type="radio" name={'q'+i} checked={ans[i]===j} onChange={()=>setAns({...ans,[i]:j})}/> {o}</label>)}</div>)}
            <button className="g" onClick={sendQ}>إرسال الإجابات</button></>}</div>}</section>

      <nav className="nav">{TABS.map(([k,ic,t])=><button key={k} className={scr===k?'on':''} onClick={()=>{setScr(k);scrollTo(0,0)}}><span className="ic">{ic}</span>{t}{k==='live'&&<i className="dot"/>}</button>)}</nav>
    </main>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
